[package]
name = "ezpz-dndz-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ezpz-dndz-cli"
path = "src/main.rs"

[dependencies]
rust-template-foundation = { workspace = true, features = ["cli"] }
ezpz-dndz-lib = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tap = { workspace = true }  # For method chaining, reduces superfluous locals
uuid = { workspace = true }
# Blocking HTTP client for the `compendium harvest` subcommand —
# pulls open-licensed monster JSON from Open5e in a one-shot
# fashion.  No tokio runtime needed; blocking is fine for CLI use.
reqwest = { workspace = true, features = ["blocking", "json"] }
# Mutating UserStore (password reset) requires the same tokio
# runtime the server uses — the file-backed store is async.
tokio = { workspace = true }
# Hidden password prompt for the `users reset-password` subcommand
# so the new value never lands in shell history or `ps` output.
rpassword = "7.4"

[lints]
workspace = true
