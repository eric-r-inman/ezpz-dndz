[package]
name = "ezpz-dndz-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "ezpz_dndz_server"
path = "src/lib.rs"

[[bin]]
name = "ezpz-dndz-server"
path = "src/main.rs"

[features]
# The first plugin: in-process session recorder.  Default-on so
# `cargo build` ships the full app; build with
# `--no-default-features` to drop the recording routes, the
# `RecordingStore` field on `AppState`, and the `axum/multipart`
# cost.  Future plugins (transcription, etc.) follow the same
# template: a feature flag here gating a module under
# `crates/server/src/<plugin>/`.
default = ["recording"]
recording = ["axum/multipart"]

[dependencies]
rust-template-foundation = { workspace = true, features = ["auth"] }
ezpz-dndz-lib = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tap = { workspace = true }  # For method chaining, reduces superfluous locals
axum = { workspace = true }
tokio = { workspace = true }
tokio-listener = { workspace = true }
aide = { workspace = true }
schemars = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }

# Required by foundation's `impl_server_state!` — the macro emits
# `FromRef` impls that name `::prometheus::Registry` and
# `::openidconnect::core::CoreClient` directly, so they have to be
# resolvable from this crate's namespace.
prometheus = { workspace = true }
openidconnect = { workspace = true }
# Used directly by the auth handlers to read/write the session
# cookie store that foundation's runner sets up.
tower-sessions = { workspace = true }

[dev-dependencies]
prometheus = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }

[lints]
workspace = true
