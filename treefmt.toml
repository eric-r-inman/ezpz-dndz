# treefmt.toml — unified formatter configuration.
# Run `treefmt` to format all files, or `treefmt <file>` for a single file.
# All formatters must be present in PATH (provided by the Nix devShell).

[formatter.rustfmt]
command = "rustfmt"
options = ["--edition", "2021"]
includes = ["*.rs"]

[formatter.alejandra]
command = "alejandra"
includes = ["*.nix"]

[formatter.elm-format]
command = "elm-format"
options = ["--yes"]
includes = ["*.elm"]

[formatter.prettier]
command = "prettier"
options = ["--write"]
includes = ["*.css"]

# org-fmt deliberately omitted: the upstream flake at
# github:LoganBarnett/org-fmt currently pulls its `orgize` input over
# `ssh://`, which fails in environments without SSH credentials.  Once
# upstream switches that input to https, port the template's 866d8ac
# wiring in (this file + flake.nix + reformat existing .org files via
# the template's f732032 one-shot).
