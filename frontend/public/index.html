<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ezpz-dndz</title>
    <script>
      // FOUC prevention: read the user's previously-chosen theme
      // from localStorage and set <html data-theme=...> BEFORE the
      // stylesheet loads.  CSS uses [data-theme="dark"] /
      // [data-theme="modern"] selectors, so this avoids a flash of
      // the wrong theme between page load and Elm boot.  Falls back
      // to "auto" (= OS pref via @media) when nothing is saved or
      // the value is invalid.  Old "light" values from before the
      // Light → Modern rename get promoted in flight.
      (function () {
        try {
          var raw = localStorage.getItem("theme");
          if (raw === "light") raw = "modern";
          var theme =
            raw === "modern" ||
            raw === "dark" ||
            raw === "auto" ||
            raw === "accessible"
              ? raw
              : "auto";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          // localStorage unavailable (private mode, file://) — let
          // CSS fall back to the OS pref.
        }
      })();
    </script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="/elm.js"></script>
    <script>
      // Init flags: hand the saved theme to Elm so the app's
      // first render matches the FOUC pre-set above.
      var savedTheme = "auto";
      try {
        var raw = localStorage.getItem("theme");
        if (raw === "light") raw = "modern";
        if (
          raw === "modern" ||
          raw === "dark" ||
          raw === "auto" ||
          raw === "accessible"
        ) {
          savedTheme = raw;
        }
      } catch (_) {}

      // Read the locally-persisted encounter (anonymous-mode
      // boot path).  When the cookie-backed auth probe later
      // returns AuthAuthenticated the value is discarded; on
      // AuthAnonymous it's decoded and adopted as the live
      // encounter.  Storing parsed JSON (not a string) keeps
      // Elm's Json.Decode.Value happy.
      var localEncounter = null;
      try {
        var encRaw = localStorage.getItem("encounter");
        if (encRaw) {
          localEncounter = JSON.parse(encRaw);
        }
      } catch (_) {
        // Malformed JSON or storage unavailable — fall through
        // to a clean slate.
      }

      // Same one-shot read for the anonymous card-layout
      // snapshot (layout + queueView + useCustomCardLayout).
      var localCardLayout = null;
      try {
        var cardRaw = localStorage.getItem("cardLayout");
        if (cardRaw) {
          localCardLayout = JSON.parse(cardRaw);
        }
      } catch (_) {}

      var app = Elm.Main.init({
        node: document.getElementById("app"),
        flags: {
          theme: savedTheme,
          localEncounter: localEncounter,
          localCardLayout: localCardLayout,
        },
      });

      // Outbound port: persist theme changes back to localStorage
      // and mirror to <html data-theme> so the next reload's
      // pre-Elm script reads the latest value (and any CSS that
      // happens to scope to <html> stays in sync).
      if (app.ports && app.ports.savePreferences) {
        app.ports.savePreferences.subscribe(function (prefs) {
          try {
            if (prefs && typeof prefs.theme === "string") {
              localStorage.setItem("theme", prefs.theme);
              document.documentElement.setAttribute(
                "data-theme",
                prefs.theme,
              );
            }
          } catch (_) {}
        });
      }

      // Outbound port: persist the live encounter into
      // localStorage for anonymous sessions.  Elm only emits this
      // when model.auth = AuthAnonymous, so we don't need to
      // double-check here.
      if (app.ports && app.ports.persistLocalEncounter) {
        app.ports.persistLocalEncounter.subscribe(function (value) {
          try {
            localStorage.setItem("encounter", JSON.stringify(value));
          } catch (_) {}
        });
      }

      // Outbound port: persist the card-layout snapshot under
      // `cardLayout`.  Same anonymous-only contract as above.
      if (app.ports && app.ports.persistLocalCardLayout) {
        app.ports.persistLocalCardLayout.subscribe(function (value) {
          try {
            localStorage.setItem("cardLayout", JSON.stringify(value));
          } catch (_) {}
        });
      }
    </script>
    <script>
      // Tooltip portal: single position: fixed div on <body>,
      // positioned by JS via getBoundingClientRect() of whichever
      // [data-tooltip] element is hovered.  Lifts the tooltip out
      // of every clipping ancestor (scroll panels, modals, rails)
      // and avoids the cross-browser quirks of CSS anchor
      // positioning (implicit-anchor failures on <button>, named-
      // anchor collisions without a working anchor-scope).
      (function () {
        var portal = document.createElement("div");
        portal.id = "tooltip-portal";
        portal.setAttribute("role", "tooltip");
        document.body.appendChild(portal);

        var showTimer = null;
        var currentTarget = null;
        var SHOW_DELAY_MS = 300;
        var GAP_PX = 6;
        var EDGE_PX = 4;

        function findTrigger(node) {
          while (node && node.nodeType === 1) {
            if (node.hasAttribute && node.hasAttribute("data-tooltip")) {
              return node;
            }
            node = node.parentNode;
          }
          return null;
        }

        function hide() {
          if (showTimer !== null) {
            clearTimeout(showTimer);
            showTimer = null;
          }
          currentTarget = null;
          portal.style.opacity = "0";
          portal.style.visibility = "hidden";
        }

        function place(target) {
          var rect = target.getBoundingClientRect();
          var pw = portal.offsetWidth;
          var ph = portal.offsetHeight;
          var vw = document.documentElement.clientWidth;
          var vh = document.documentElement.clientHeight;

          // Default: above the trigger, horizontally centred.
          var top = rect.top - ph - GAP_PX;
          var left = rect.left + rect.width / 2 - pw / 2;

          // Flip below if no room above.
          if (top < EDGE_PX) {
            top = rect.bottom + GAP_PX;
          }
          // Clamp horizontally to the viewport.
          if (left < EDGE_PX) left = EDGE_PX;
          if (left + pw > vw - EDGE_PX) left = vw - pw - EDGE_PX;
          // Clamp vertically too, in case neither above nor below fits.
          if (top + ph > vh - EDGE_PX) top = vh - ph - EDGE_PX;
          if (top < EDGE_PX) top = EDGE_PX;

          portal.style.top = top + "px";
          portal.style.left = left + "px";
        }

        function show(target) {
          var text = target.getAttribute("data-tooltip");
          if (!text) return;
          portal.textContent = text;
          // Render at (0, 0) hidden first so offsetWidth / offsetHeight
          // are accurate, then position and reveal on the next frame.
          portal.style.visibility = "hidden";
          portal.style.opacity = "0";
          portal.style.top = "0";
          portal.style.left = "0";
          requestAnimationFrame(function () {
            if (currentTarget !== target) return;
            place(target);
            portal.style.visibility = "visible";
            portal.style.opacity = "1";
          });
        }

        document.addEventListener("mouseover", function (e) {
          var trigger = findTrigger(e.target);
          if (!trigger || trigger === currentTarget) return;
          if (showTimer !== null) clearTimeout(showTimer);
          currentTarget = trigger;
          // Per-trigger delay override.  `data-tooltip-delay="0"` (or
          // any non-positive value) shows the tooltip on the next
          // frame, useful for low-affordance icons like the stat-block
          // 🏷 where the user is already hovering deliberately and
          // shouldn't have to wait 300ms to learn what's behind it.
          var delayAttr = trigger.getAttribute("data-tooltip-delay");
          var delay = SHOW_DELAY_MS;
          if (delayAttr !== null) {
            var parsed = parseInt(delayAttr, 10);
            if (!isNaN(parsed)) delay = parsed;
          }
          if (delay <= 0) {
            show(trigger);
          } else {
            showTimer = setTimeout(function () {
              if (currentTarget === trigger) show(trigger);
            }, delay);
          }
        });

        document.addEventListener("mouseout", function (e) {
          var trigger = findTrigger(e.target);
          if (!trigger) return;
          // Ignore mouseout between the trigger and one of its
          // descendants — still inside the trigger.
          var related = e.relatedTarget;
          if (related && trigger.contains(related)) return;
          hide();
        });

        document.addEventListener("focusin", function (e) {
          var trigger = findTrigger(e.target);
          if (!trigger) return;
          // Only show on keyboard focus, mirroring the CSS rule we
          // previously used (`:focus-visible`).  Mouse-click focus
          // shouldn't trigger a tooltip pop.
          var fv = false;
          try {
            fv = trigger.matches(":focus-visible");
          } catch (_) {
            fv = true;
          }
          if (!fv) return;
          currentTarget = trigger;
          show(trigger);
        });

        document.addEventListener("focusout", function (e) {
          var trigger = findTrigger(e.target);
          if (!trigger) return;
          hide();
        });

        // Tooltip position becomes stale if anything scrolls under
        // the cursor — just hide.  Cheaper than recomputing.
        document.addEventListener("scroll", hide, true);
        window.addEventListener("resize", hide);
      })();
    </script>
  </body>
</html>
