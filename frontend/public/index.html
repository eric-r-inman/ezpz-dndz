<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ezpz-dndz</title>
    <script>
      // FOUC prevention: read the user's previously-chosen theme
      // from localStorage and set <html data-theme=...> BEFORE the
      // stylesheet loads.  CSS uses [data-theme="dark"] /
      // [data-theme="modern"] / [data-theme="accessible"]
      // selectors, so this avoids a flash of the wrong theme
      // between page load and Elm boot.  Falls back to "modern"
      // when nothing is saved or the value is invalid.  Legacy
      // "light" (pre Light → Modern rename) and "auto" (the now-
      // removed OS-follow theme) values get promoted in flight.
      (function () {
        try {
          var raw = localStorage.getItem("theme");
          if (raw === "light" || raw === "auto") raw = "modern";
          var theme =
            raw === "modern" || raw === "dark" || raw === "accessible"
              ? raw
              : "modern";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          // localStorage unavailable (private mode, file://) —
          // leave the attribute unset; :root defaults to Modern.
        }
      })();
    </script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="/elm.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
