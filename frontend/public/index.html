<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ezpz-dndz</title>
    <script>
      // FOUC prevention: read the user's previously-chosen theme
      // from localStorage and set <html data-theme=...> BEFORE the
      // stylesheet loads.  CSS uses [data-theme="dark"] /
      // [data-theme="modern"] / [data-theme="accessible"]
      // selectors, so this avoids a flash of the wrong theme
      // between page load and Elm boot.  Falls back to "modern"
      // when nothing is saved or the value is invalid.  Legacy
      // "light" (pre Light → Modern rename) and "auto" (the now-
      // removed OS-follow theme) values get promoted in flight.
      (function () {
        try {
          var raw = localStorage.getItem("theme");
          if (raw === "light" || raw === "auto") raw = "modern";
          var theme =
            raw === "modern" || raw === "dark" || raw === "accessible"
              ? raw
              : "modern";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (_) {
          // localStorage unavailable (private mode, file://) —
          // leave the attribute unset; :root defaults to Modern.
        }
      })();
    </script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="/elm.js"></script>
    <script>
      // Init flags: hand the saved theme to Elm so the app's
      // first render matches the FOUC pre-set above.
      var savedTheme = "modern";
      try {
        var raw = localStorage.getItem("theme");
        if (raw === "light" || raw === "auto") raw = "modern";
        if (raw === "modern" || raw === "dark" || raw === "accessible") {
          savedTheme = raw;
        }
      } catch (_) {}

      // Read the locally-persisted encounter (anonymous-mode
      // boot path).  When the cookie-backed auth probe later
      // returns AuthAuthenticated the value is discarded; on
      // AuthAnonymous it's decoded and adopted as the live
      // encounter.  Storing parsed JSON (not a string) keeps
      // Elm's Json.Decode.Value happy.
      var localEncounter = null;
      try {
        var encRaw = localStorage.getItem("encounter");
        if (encRaw) {
          localEncounter = JSON.parse(encRaw);
        }
      } catch (_) {
        // Malformed JSON or storage unavailable — fall through
        // to a clean slate.
      }

      // Pre-formatted "today" string used as the suffix on the
      // named save slot if the auth probe lands authenticated and
      // there's a non-empty local encounter to migrate.  Falls
      // back to an ISO date if locale formatting fails.
      var migrationDateLabel;
      try {
        migrationDateLabel = new Date().toLocaleDateString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
        });
      } catch (_) {
        migrationDateLabel = new Date().toISOString().slice(0, 10);
      }

      // Anonymous-mode dice-history snapshot.  Same shape as the
      // server's /api/dice/history response (an array of encoded
      // rolls).  Adopted on the anonymous boot branch; discarded
      // and replaced with the server's history on the
      // authenticated branch.
      var localDiceHistory = null;
      try {
        var diceRaw = localStorage.getItem("diceHistory");
        if (diceRaw) {
          localDiceHistory = JSON.parse(diceRaw);
        }
      } catch (_) {}

      // Anonymous-mode compendium snapshot
      // ({ creatures, groups, next_local_id }).  Adopted on the
      // anonymous boot branch in place of the bundled-creatures
      // fetch when present.
      var localCompendium = null;
      try {
        var compRaw = localStorage.getItem("compendium");
        if (compRaw) {
          localCompendium = JSON.parse(compRaw);
        }
      } catch (_) {}

      // Anonymous named encounter saves
      // ({ "<name>": { encounter, created_at, updated_at } }).
      var localEncounterSaves = null;
      try {
        var savesRaw = localStorage.getItem("encounterSaves");
        if (savesRaw) {
          localEncounterSaves = JSON.parse(savesRaw);
        }
      } catch (_) {}

      // User-named condition presets ({ "<name>": preset-body }).
      // Backs the Save/Load row in the Add-Condition modal.
      var localConditionPresets = null;
      try {
        var presetsRaw = localStorage.getItem("conditionPresets");
        if (presetsRaw) {
          localConditionPresets = JSON.parse(presetsRaw);
        }
      } catch (_) {}

      // User-named timer presets — twin of conditionPresets.
      var localTimerPresets = null;
      try {
        var timerPresetsRaw = localStorage.getItem("timerPresets");
        if (timerPresetsRaw) {
          localTimerPresets = JSON.parse(timerPresetsRaw);
        }
      } catch (_) {}

      // User-named Save Chain presets — reusable save + effect
      // recipes edited in the Save Chain modal on each creature
      // card.  Same shape / persistence model as the other
      // preset dicts.
      var localSaveChainPresets = null;
      try {
        var saveChainRaw = localStorage.getItem("saveChainPresets");
        if (saveChainRaw) {
          localSaveChainPresets = JSON.parse(saveChainRaw);
        }
      } catch (_) {}

      // Party roster — { members: [...], next_id: N } —
      // shared by the CR Calculator and Random Encounter modals.
      var localParty = null;
      try {
        var partyRaw = localStorage.getItem("party");
        if (partyRaw) {
          localParty = JSON.parse(partyRaw);
        }
      } catch (_) {}

      // User-authored Lore groups for the Random Encounter
      // generator's Lore-leaning toggle.  Bundled groups
      // ship with the app; this is the player's additions.
      var localUserLoreGroups = null;
      try {
        var loreRaw = localStorage.getItem("userLoreGroups");
        if (loreRaw) {
          localUserLoreGroups = JSON.parse(loreRaw);
        }
      } catch (_) {}

      // Singular per-user treasure table.  Anonymous-mode only;
      // authed sessions pull from /api/treasure-table instead.
      var localUserTreasureTable = null;
      try {
        var treasureRaw = localStorage.getItem("userTreasureTable");
        if (treasureRaw) {
          localUserTreasureTable = JSON.parse(treasureRaw);
        }
      } catch (_) {}

      // One-time clearance of the obsolete user-tables list from
      // the prior PR #39 model (a list of named UserTables).  The
      // new singular-table feature doesn't translate the old shape;
      // we just drop it so a future reload doesn't accidentally
      // surface stale data.
      try {
        if (localStorage.getItem("userTreasureTables") !== null) {
          localStorage.removeItem("userTreasureTables");
        }
      } catch (_) {}

      var app = Elm.Main.init({
        node: document.getElementById("app"),
        flags: {
          theme: savedTheme,
          localEncounter: localEncounter,
          migrationDateLabel: migrationDateLabel,
          localDiceHistory: localDiceHistory,
          localCompendium: localCompendium,
          localEncounterSaves: localEncounterSaves,
          localConditionPresets: localConditionPresets,
          localTimerPresets: localTimerPresets,
          localSaveChainPresets: localSaveChainPresets,
          localParty: localParty,
          localUserLoreGroups: localUserLoreGroups,
          localUserTreasureTable: localUserTreasureTable,
          bootMs: Date.now(),
        },
      });

      // Outbound port: persist theme changes back to localStorage
      // and mirror to <html data-theme> so the next reload's
      // pre-Elm script reads the latest value (and any CSS that
      // happens to scope to <html> stays in sync).
      if (app.ports && app.ports.savePreferences) {
        app.ports.savePreferences.subscribe(function (prefs) {
          try {
            if (prefs && typeof prefs.theme === "string") {
              localStorage.setItem("theme", prefs.theme);
              document.documentElement.setAttribute(
                "data-theme",
                prefs.theme,
              );
            }
          } catch (_) {}
        });
      }

      // Outbound port: persist the live encounter into
      // localStorage for anonymous sessions.  Elm only emits this
      // when model.auth = AuthAnonymous, so we don't need to
      // double-check here.
      if (app.ports && app.ports.persistLocalEncounter) {
        app.ports.persistLocalEncounter.subscribe(function (value) {
          try {
            localStorage.setItem("encounter", JSON.stringify(value));
          } catch (_) {}
        });
      }

      // Outbound port: drop the locally-persisted encounter after
      // a successful login-time migration so the next reload
      // doesn't re-migrate the same data.
      if (app.ports && app.ports.clearLocalEncounter) {
        app.ports.clearLocalEncounter.subscribe(function () {
          try {
            localStorage.removeItem("encounter");
          } catch (_) {}
        });
      }

      // Anonymous compendium snapshot writer.
      if (app.ports && app.ports.persistLocalCompendium) {
        app.ports.persistLocalCompendium.subscribe(function (value) {
          try {
            localStorage.setItem("compendium", JSON.stringify(value));
          } catch (_) {}
        });
      }

      // Anonymous compendium snapshot eraser — fired after a
      // successful sign-in migration to the server.
      if (app.ports && app.ports.clearLocalCompendium) {
        app.ports.clearLocalCompendium.subscribe(function () {
          try {
            localStorage.removeItem("compendium");
          } catch (_) {}
        });
      }

      // Outbound port: persist the dice-history list under
      // `diceHistory` for anonymous sessions.  Same
      // anonymous-only contract as the encounter port (Elm only
      // emits this when model.auth is anonymous).
      if (app.ports && app.ports.persistLocalDiceHistory) {
        app.ports.persistLocalDiceHistory.subscribe(function (value) {
          try {
            localStorage.setItem("diceHistory", JSON.stringify(value));
          } catch (_) {}
        });
      }

      // User-named condition presets writer.  Both anonymous and
      // authenticated sessions persist through this same port —
      // there's no server endpoint for presets yet.
      if (app.ports && app.ports.persistLocalConditionPresets) {
        app.ports.persistLocalConditionPresets.subscribe(function (value) {
          try {
            localStorage.setItem(
              "conditionPresets",
              JSON.stringify(value),
            );
          } catch (_) {}
        });
      }

      // Twin port for the timer presets dict.
      if (app.ports && app.ports.persistLocalTimerPresets) {
        app.ports.persistLocalTimerPresets.subscribe(function (value) {
          try {
            localStorage.setItem(
              "timerPresets",
              JSON.stringify(value),
            );
          } catch (_) {}
        });
      }

      // Save Chain presets — reusable save + effect recipes
      // stored keyed by name.  Same shape / write discipline as
      // the condition and timer preset dicts above.
      if (app.ports && app.ports.persistLocalSaveChainPresets) {
        app.ports.persistLocalSaveChainPresets.subscribe(function (value) {
          try {
            localStorage.setItem(
              "saveChainPresets",
              JSON.stringify(value),
            );
          } catch (_) {}
        });
      }

      // Copy an arbitrary string to the clipboard.  Fire-and-
      // forget: Firefox can reject an untrusted write, but
      // there's nothing the Elm side would do about it — the
      // button caller shows a toast synchronously.
      if (app.ports && app.ports.copyToClipboard) {
        app.ports.copyToClipboard.subscribe(function (value) {
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(String(value)).catch(function () {});
            }
          } catch (_) {}
        });
      }

      // Party roster — { members: [...], next_id: N }.
      // Persists across sessions so the CR Calculator and
      // Random Encounter modals don't make the GM re-enter
      // their party every reload.
      if (app.ports && app.ports.persistLocalParty) {
        app.ports.persistLocalParty.subscribe(function (value) {
          try {
            localStorage.setItem("party", JSON.stringify(value));
          } catch (_) {}
        });
      }

      // User-authored Lore groups for the Random Encounter
      // generator.  Fires on every Save / Delete in the
      // Create/Edit Group modal's Lore section.
      if (app.ports && app.ports.persistLocalUserLoreGroups) {
        app.ports.persistLocalUserLoreGroups.subscribe(function (value) {
          try {
            localStorage.setItem(
              "userLoreGroups",
              JSON.stringify(value),
            );
          } catch (_) {}
        });
      }

      // Singular per-user treasure table.  Fires on every edit
      // in the Treasure Table editor modal.
      if (app.ports && app.ports.persistLocalUserTreasureTable) {
        app.ports.persistLocalUserTreasureTable.subscribe(function (value) {
          try {
            localStorage.setItem(
              "userTreasureTable",
              JSON.stringify(value),
            );
          } catch (_) {}
        });
      }

      // Anonymous named encounter saves dict writer + eraser.
      if (app.ports && app.ports.persistLocalEncounterSaves) {
        app.ports.persistLocalEncounterSaves.subscribe(function (value) {
          try {
            localStorage.setItem("encounterSaves", JSON.stringify(value));
          } catch (_) {}
        });
      }
      if (app.ports && app.ports.clearLocalEncounterSaves) {
        app.ports.clearLocalEncounterSaves.subscribe(function () {
          try {
            localStorage.removeItem("encounterSaves");
          } catch (_) {}
        });
      }

      // Cross-tab dice-roll sync.  When a roll lands in any tab,
      // Elm fires `broadcastDiceRoll` with the encoded roll; every
      // other tab of the app open in the same browser profile
      // receives the same value via `incomingDiceRoll` and pushes
      // it into its own dice history.  Solves the case where a
      // stat block is opened in its own tab — rolls fired there
      // would otherwise be invisible to the main encounter tab's
      // dice modal.  `BroadcastChannel` does NOT echo to the
      // sender, so no self-filtering is needed.
      var diceChannel = null;
      try {
        if (typeof BroadcastChannel === "function") {
          diceChannel = new BroadcastChannel("ezpz-dndz-dice");
        }
      } catch (_) {
        // Older browser / disabled by privacy mode — degrade to
        // per-tab dice histories.
      }
      if (
        diceChannel &&
        app.ports &&
        app.ports.broadcastDiceRoll &&
        app.ports.incomingDiceRoll
      ) {
        app.ports.broadcastDiceRoll.subscribe(function (value) {
          try {
            diceChannel.postMessage(value);
          } catch (_) {}
        });
        diceChannel.onmessage = function (event) {
          try {
            app.ports.incomingDiceRoll.send(event.data);
          } catch (_) {}
        };
      } else if (app.ports && app.ports.broadcastDiceRoll) {
        // No channel available — swallow outbound broadcasts so
        // the port still has a subscriber (Elm errors otherwise).
        app.ports.broadcastDiceRoll.subscribe(function () {});
      }

      // Cross-tab encounter sync.  Mirrors the dice channel above:
      // the main tab posts the encounter on every change, and a
      // quick-list tab opened in the same browser profile picks
      // the changes up live.  Same BroadcastChannel discipline —
      // no self-echo, so loops are impossible.
      var encounterChannel = null;
      try {
        if (typeof BroadcastChannel === "function") {
          encounterChannel = new BroadcastChannel("ezpz-dndz-encounter");
        }
      } catch (_) {
        // Older browser / privacy mode — quick-list tab won't
        // auto-update, but the main app still works.
      }
      if (
        encounterChannel &&
        app.ports &&
        app.ports.broadcastEncounter &&
        app.ports.incomingEncounter
      ) {
        app.ports.broadcastEncounter.subscribe(function (value) {
          try {
            encounterChannel.postMessage(value);
          } catch (_) {}
        });
        encounterChannel.onmessage = function (event) {
          try {
            app.ports.incomingEncounter.send(event.data);
          } catch (_) {}
        };
      } else if (app.ports && app.ports.broadcastEncounter) {
        app.ports.broadcastEncounter.subscribe(function () {});
      }

      // Cross-tab "pin creature + scroll" request: the QuickList
      // tab fires this when the GM clicks a row so the main tab
      // pins the stat block, scrolls the card into view, and
      // (best-effort) surfaces itself via window.opener.focus().
      // Same BroadcastChannel discipline as the encounter channel
      // above — no self-echo, no loops.
      var panelShowChannel = null;
      try {
        if (typeof BroadcastChannel === "function") {
          panelShowChannel = new BroadcastChannel("ezpz-dndz-panel-show");
        }
      } catch (_) {}
      if (
        app.ports &&
        app.ports.broadcastPanelShow &&
        app.ports.incomingPanelShow
      ) {
        app.ports.broadcastPanelShow.subscribe(function (value) {
          try {
            if (panelShowChannel) panelShowChannel.postMessage(value);
          } catch (_) {}
          // Bring the main tab to front.  Requires that the
          // QuickList link is opened WITHOUT rel="noopener"; if
          // the opener is missing (main tab was reloaded since
          // this QuickList tab opened) the focus is a no-op and
          // the pin + scroll still lands on the main tab as
          // soon as the GM navigates there.
          try {
            if (window.opener && !window.opener.closed) {
              window.opener.focus();
            }
          } catch (_) {}
        });
        if (panelShowChannel) {
          panelShowChannel.onmessage = function (event) {
            try {
              app.ports.incomingPanelShow.send(event.data);
            } catch (_) {}
          };
        }
      }

      // Standalone Compendium tab.  Each Elm app instance keeps a
      // single window reference; opening twice from the same main
      // tab refocuses the existing window rather than spawning a
      // duplicate.  When the user closes that tab, the next click
      // notices `closed === true` and falls back to opening the
      // modal in place.
      var compendiumWindow = null;

      if (app.ports && app.ports.openCompendiumTab) {
        app.ports.openCompendiumTab.subscribe(function () {
          try {
            if (compendiumWindow && !compendiumWindow.closed) {
              compendiumWindow.focus();
            } else {
              compendiumWindow = window.open(
                "/compendium",
                "ezpz-dndz-compendium",
              );
              if (compendiumWindow) {
                compendiumWindow.focus();
              }
            }
          } catch (_) {
            compendiumWindow = null;
          }
        });
      }

      if (
        app.ports &&
        app.ports.tryFocusCompendiumTab &&
        app.ports.compendiumTabMissing
      ) {
        app.ports.tryFocusCompendiumTab.subscribe(function () {
          try {
            if (compendiumWindow && !compendiumWindow.closed) {
              compendiumWindow.focus();
            } else {
              compendiumWindow = null;
              app.ports.compendiumTabMissing.send(null);
            }
          } catch (_) {
            compendiumWindow = null;
            app.ports.compendiumTabMissing.send(null);
          }
        });
      }
    </script>
    <script>
      // Tooltip portal: single position: fixed div on <body>,
      // positioned by JS via getBoundingClientRect() of whichever
      // [data-tooltip] element is hovered.  Lifts the tooltip out
      // of every clipping ancestor (scroll panels, modals, rails)
      // and avoids the cross-browser quirks of CSS anchor
      // positioning (implicit-anchor failures on <button>, named-
      // anchor collisions without a working anchor-scope).
      (function () {
        var portal = document.createElement("div");
        portal.id = "tooltip-portal";
        portal.setAttribute("role", "tooltip");
        document.body.appendChild(portal);

        var showTimer = null;
        var currentTarget = null;
        var SHOW_DELAY_MS = 300;
        var GAP_PX = 6;
        var EDGE_PX = 4;

        function findTrigger(node) {
          while (node && node.nodeType === 1) {
            if (node.hasAttribute && node.hasAttribute("data-tooltip")) {
              return node;
            }
            node = node.parentNode;
          }
          return null;
        }

        function hide() {
          if (showTimer !== null) {
            clearTimeout(showTimer);
            showTimer = null;
          }
          currentTarget = null;
          portal.style.opacity = "0";
          portal.style.visibility = "hidden";
        }

        function place(target) {
          var rect = target.getBoundingClientRect();
          var pw = portal.offsetWidth;
          var ph = portal.offsetHeight;
          var vw = document.documentElement.clientWidth;
          var vh = document.documentElement.clientHeight;

          // Default: above the trigger, horizontally centred.
          var top = rect.top - ph - GAP_PX;
          var left = rect.left + rect.width / 2 - pw / 2;

          // Flip below if no room above.
          if (top < EDGE_PX) {
            top = rect.bottom + GAP_PX;
          }
          // Clamp horizontally to the viewport.
          if (left < EDGE_PX) left = EDGE_PX;
          if (left + pw > vw - EDGE_PX) left = vw - pw - EDGE_PX;
          // Clamp vertically too, in case neither above nor below fits.
          if (top + ph > vh - EDGE_PX) top = vh - ph - EDGE_PX;
          if (top < EDGE_PX) top = EDGE_PX;

          portal.style.top = top + "px";
          portal.style.left = left + "px";
        }

        function show(target) {
          var text = target.getAttribute("data-tooltip");
          if (!text) return;
          portal.textContent = text;
          // Render at (0, 0) hidden first so offsetWidth / offsetHeight
          // are accurate, then position and reveal on the next frame.
          portal.style.visibility = "hidden";
          portal.style.opacity = "0";
          portal.style.top = "0";
          portal.style.left = "0";
          requestAnimationFrame(function () {
            if (currentTarget !== target) return;
            place(target);
            portal.style.visibility = "visible";
            portal.style.opacity = "1";
          });
        }

        document.addEventListener("mouseover", function (e) {
          var trigger = findTrigger(e.target);
          if (!trigger || trigger === currentTarget) return;
          if (showTimer !== null) clearTimeout(showTimer);
          currentTarget = trigger;
          // Per-trigger delay override.  `data-tooltip-delay="0"` (or
          // any non-positive value) shows the tooltip on the next
          // frame, useful for low-affordance icons like the stat-block
          // 🏷 where the user is already hovering deliberately and
          // shouldn't have to wait 300ms to learn what's behind it.
          var delayAttr = trigger.getAttribute("data-tooltip-delay");
          var delay = SHOW_DELAY_MS;
          if (delayAttr !== null) {
            var parsed = parseInt(delayAttr, 10);
            if (!isNaN(parsed)) delay = parsed;
          }
          if (delay <= 0) {
            show(trigger);
          } else {
            showTimer = setTimeout(function () {
              if (currentTarget === trigger) show(trigger);
            }, delay);
          }
        });

        document.addEventListener("mouseout", function (e) {
          var trigger = findTrigger(e.target);
          if (!trigger) return;
          // Ignore mouseout between the trigger and one of its
          // descendants — still inside the trigger.
          var related = e.relatedTarget;
          if (related && trigger.contains(related)) return;
          hide();
        });

        document.addEventListener("focusin", function (e) {
          var trigger = findTrigger(e.target);
          if (!trigger) return;
          // Only show on keyboard focus, mirroring the CSS rule we
          // previously used (`:focus-visible`).  Mouse-click focus
          // shouldn't trigger a tooltip pop.
          var fv = false;
          try {
            fv = trigger.matches(":focus-visible");
          } catch (_) {
            fv = true;
          }
          if (!fv) return;
          currentTarget = trigger;
          show(trigger);
        });

        document.addEventListener("focusout", function (e) {
          var trigger = findTrigger(e.target);
          if (!trigger) return;
          hide();
        });

        // Tooltip position becomes stale if anything scrolls under
        // the cursor — just hide.  Cheaper than recomputing.
        document.addEventListener("scroll", hide, true);
        window.addEventListener("resize", hide);
      })();
    </script>

    <script>
      // Modal focus-trap.  When Tab walks past the last focusable
      // element inside a modal it lands on the END sentinel
      // (`.modal__focus-sentinel`, rendered by `View.Modal`).  We
      // detect the focus on the sentinel and redirect it back to
      // the modal close button — the user's keyboard wraps inside
      // the dialog instead of escaping to the underlying page.
      //
      // Implemented here in JS rather than in Elm because a pure-
      // Elm trap would require threading a "sentinel-focused" Msg
      // through every modal's update handler (~20 modals).  The
      // listener lives outside Elm's view layer; Elm just renders
      // the sentinel + the close button with their stable
      // class/id, and JS handles the redirect with no Cmd
      // plumbing.
      (function () {
        document.addEventListener(
          "focus",
          function (e) {
            if (
              e.target &&
              e.target.classList &&
              e.target.classList.contains("modal__focus-sentinel")
            ) {
              var btn = document.getElementById("modal-close-btn");
              if (btn) btn.focus();
            }
          },
          true,
        );
      })();
    </script>
  </body>
</html>
