name: Dependabot auto-merge

# Fires only after CI has actually completed, so the auto-merge attempt
# can't race ahead of the test job.  The branch-protection rule blocks a
# bare `on: pull_request` automerge until checks pass anyway, but waiting
# for the workflow_run event is cheaper and gives us a clean success
# signal to read.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  automerge:
    # The event / conclusion guard that used to live here is now owned
    # by the reusable workflow.  Keeping the local copy would filter
    # out the changelog re-dispatch pass (a workflow_dispatch run is
    # neither a pull_request event nor, at that point, a concluded
    # one), stalling the merge.  The dependabot-actor guard stays: it
    # is this project's own restriction, not the superseded one.
    if: github.actor == 'dependabot[bot]'
    uses: LoganBarnett/rust-template/.github/workflows/reusable-dependabot-automerge.yml@main
    secrets: inherit
