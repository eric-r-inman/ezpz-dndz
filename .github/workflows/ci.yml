name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The dependency-bump flow dispatches this workflow on its bump branch: a
  # GITHUB_TOKEN push fires no `push`/`pull_request` run (the no-cascade
  # rule), but `workflow_dispatch` is exempt, so dispatching is how the
  # required checks run against the bump commit.  See the template's
  # reusable-dependency-bump.yml.
  workflow_dispatch:

# Cancel superseded runs on the same PR / branch so the queue
# doesn't pile up when force-pushing during review.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: LoganBarnett/rust-template/.github/workflows/reusable-ci.yml@main

  # The reusable workflow covers the Rust suite (test, fmt, clippy), the
  # changelog-entry gate, the ABI check, and the release-artifact builds —
  # which compile the Elm frontend as a package input under `nix build`.
  # The jobs below cover what it does not: the Elm unit tests and the
  # treefmt formatter sweep (Elm, Nix, and org-mode formatting alongside
  # rustfmt).
  elm-test:
    name: Elm tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Install Nix + restore/save the `/nix` store cache.  See the
      # template's .github/actions/setup-nix for the rationale.
      - uses: LoganBarnett/rust-template/.github/actions/setup-nix@main

      - name: Elm package cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.elm
            frontend/elm-stuff
          key: ${{ runner.os }}-elm-${{ hashFiles('frontend/elm.json') }}
          restore-keys: |
            ${{ runner.os }}-elm-

      - name: elm-test
        run: nix develop --command bash -c "cd frontend && elm-test"

  treefmt:
    name: Treefmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Install Nix + restore/save the `/nix` store cache.  See the
      # template's .github/actions/setup-nix for the rationale.
      - uses: LoganBarnett/rust-template/.github/actions/setup-nix@main

      # `treefmt --ci` exits non-zero if any file would be reformatted,
      # which is exactly what we want from a CI gate.
      - name: treefmt --ci
        run: nix develop --command treefmt --ci
