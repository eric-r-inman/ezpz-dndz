[pytest]
# Run through `just qa`, which builds the app first.  See README.org.
pythonpath = .
# Every scenario runs in Chromium.  Those marked cross_browser also run in
# Firefox.  The cache provider is off so no cache folder lands in qa/.
addopts =
    --browser chromium
    --browser firefox
    --screenshot only-on-failure
    --tracing retain-on-failure
    -p no:cacheprovider
xfail_strict = true
