# Example configuration file for ezpz-dndz applications
# Copy this file to config.toml and customize as needed

# Logging configuration
log_level = "info"  # Options: trace, debug, info, warn, error
log_format = "text"  # Options: text, json

# Web-specific options
# listen = "127.0.0.1:3000"  # TCP: host:port
# listen = "/run/myapp/myapp.sock"  # Unix domain socket path
# listen = "sd-listen"  # Inherit socket from systemd (socket activation)

# Runtime persistence root. The default SQLite database
# (<data_dir>/ezpz-dndz.db), the legacy JSON files imported on the
# first boot of a pre-relational deployment, and the backups/
# subdirectory all live under this directory. Default: cwd.
# data_dir = "/var/lib/ezpz-dndz"

# Database connection URL. Defaults to a SQLite file inside data_dir
# (zero configuration for small deployments); point at PostgreSQL
# for hosted scale. The server creates and migrates its schema on
# boot either way.
# database_url = "sqlite:///var/lib/ezpz-dndz/ezpz-dndz.db"
# database_url = "postgres://ezpz:secret@localhost/ezpz_dndz"

# OIDC (single-sign-on). Leave commented to run unauthenticated.
# Production deployments behind Authelia / Keycloak / similar set
# all three fields. See docs/ARCHITECTURE.org for the deployment
# notes.
# base_url = "https://dndz.example.com"
# oidc_issuer = "https://sso.example.com/application/o/ezpz-dndz"
# oidc_client_id = "ezpz-dndz"
# oidc_client_secret_file = "/etc/credentials/ezpz-dndz-oidc.secret"
