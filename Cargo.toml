[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/lib",
    "crates/server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Eric Rinman <ericrinman@gmail.com>"]
# Source-available, not OSS — see LICENSE for the full PolyForm
# Strict 1.0.0 text.  The `LicenseRef-` prefix is the SPDX
# convention for licenses that aren't on the SPDX-approved list;
# Cargo accepts it as a free-form identifier.
license = "LicenseRef-PolyForm-Strict-1.0.0"
repository = "https://github.com/eric-r-inman/ezpz-dndz"

[workspace.dependencies]
# Foundation infrastructure crate (config, logging, health, metrics,
# auth) shared with rust-template-spawned siblings.  The git pin keeps
# us synchronised with the template's HEAD; advance it together with
# rust-template.json's template_sync_hashes during compliance work.
rust-template-foundation = { git = "https://github.com/LoganBarnett/rust-template.git", version = ">=0.16" }

# Logging and tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-journald = "0.3"

# Systemd integration
sd-notify = "0.4"

# Utilities
# tap - Enables method chaining and reduces superfluous local variables
# that only exist to name intermediate results. Prefer .tap() over temporary
# variables when it improves readability.
tap = "1.0"

# CLI parsing
clap = { version = "4.6", features = ["derive", "env"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "2.0"

# Content hashing for bundle-version edit detection.  Used by the
# compendium store to record a stable digest of each bundled
# creature at apply time so future bundle bumps can detect whether
# a user has edited a creature (skip update) or not (auto-update).
sha2 = "0.10"

# UUIDs (compendium creature ids, eventually user ids).  Used to
# generate the id strings; the wire format keeps them as `String`
# so the schemars JsonSchema derives stay clean.
uuid = { version = "1", features = ["v4", "v5"] }

# Password hashing for user accounts.  Argon2id is the modern
# best-practice choice (memory-hard, side-channel resistant).
argon2 = { version = "0.5", features = ["std"] }

# Web framework
axum = "0.8"
tokio = { version = "1.52", features = ["full"] }
tokio-listener = { version = "0.5", features = ["axum08"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }

# Embeds the compiled Elm frontend into the server binary: nix builds
# hand the asset directory to the server crate's build.rs and release
# builds bake it in (debug builds read from disk).  `mime-guess` drives
# the Content-Type the foundation's SPA service returns;
# `interpolate-folder-path` lets the `#[folder]` attribute expand
# `$RUST_TEMPLATE_FRONTEND_DIR` (set by the server crate's build.rs).
rust-embed = { version = "8", features = ["mime-guess", "interpolate-folder-path"] }

# Testing
tempfile = "3"

# OpenMetrics/Prometheus.  Pinned to 0.13 so the version matches
# the foundation crate's BaseServerState (foundation pulls in
# prometheus 0.13 transitively; `impl_server_state!` emits
# FromRef impls that reference `::prometheus::Registry` from THIS
# crate's namespace, so the two must agree).  Bumping past 0.13
# requires foundation to move first.
prometheus = "0.13"

# OpenAPI
aide = { version = "0.15", features = ["axum", "axum-json", "axum-query", "scalar", "macros"] }
# Pinned to 0.9 so JsonSchema derives in our types resolve to the
# same `schemars` version that aide 0.15.x consumes internally.
# Bumping to 1.x requires aide to move first; mixing the two breaks
# the `Json<T>: OperationInput` trait check for handlers.
schemars = "0.9"

# Authentication.  Pinned to 3.x so the `CoreClient` type lines up
# with what foundation's `BaseServerState` uses — same reasoning as
# the prometheus pin above; `impl_server_state!` emits FromRef impls
# that reference foundation's openidconnect version through this
# crate's namespace.
openidconnect = { version = "3", features = ["reqwest"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
tower-sessions = { version = "0.15", features = ["memory-store"] }

# Relational storage.  One `Db` handle (an `AnyPool`) serves two
# interchangeable backends: SQLite for zero-ops dev / small deploys
# and PostgreSQL for hosted scale.  `migrate` embeds the shared
# portable .sql migrations into the lib crate; `tls-rustls` keeps the
# Postgres path OpenSSL-free like the rest of the workspace.  The
# bundled libsqlite3-sys C build rides on the dev shell's cc.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "postgres", "any", "migrate", "derive", "macros"] }

# Shared library
ezpz-dndz-lib = { path = "crates/lib" }

# The server crate consumed as a library.  The relational stores and
# their wire codecs (dice history, per-user compendium, encounters)
# live there next to the HTTP routes they serve; the CLI reuses them
# to operate on the same database while the server is stopped.
ezpz-dndz-server = { path = "crates/server" }

# ============================================================================
# BUILD PROFILES
# ============================================================================
# Without these settings, target/debug can easily reach 20-40 GB on
# non-trivial projects.  Dependencies are the primary culprit.
#
# See https://doc.rust-lang.org/cargo/reference/profiles.html

[profile.dev]
# No debug symbols.  The debugger is rarely used and debug symbols are
# the single largest contributor to target/ bloat.
debug = false
# Disable incremental compilation.  Incremental writes many small files
# to target/debug/incremental/ that accumulate quickly; the compile-time
# benefit rarely outweighs the disk cost for typical workflows.
incremental = false

[profile.dev.package."*"]
# Optimize dependencies even in dev builds.  Libraries like tokio and
# axum are bottlenecks when unoptimized; this makes the program run at
# near-release speed during development with minimal extra compile time
# on subsequent incremental builds.
opt-level = 3

[profile.release]
debug = false
# These binaries are shipped as release artifacts, so optimize them for
# the end user rather than for build speed.  lto and a single codegen
# unit let the optimizer work across crate boundaries (faster runtime,
# smaller code), and strip removes symbols from the artifact to shrink
# the download.  opt-level stays at the default 3 — tuned for speed,
# not size.
lto = true
codegen-units = 1
strip = true

# ============================================================================
# LINTS
# ============================================================================
# Project-wide ban on the panicking variants of Result/Option, enforced
# via clippy.  Test code is exempted by clippy.toml's
# allow-unwrap-in-tests / allow-expect-in-tests, which cover both
# #[cfg(test)] modules in src/ and integration tests under tests/.
# Member crates opt in by setting [lints] workspace = true.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# ----------------------------------------------------------------------------
# Combinator preference: nudge toward the least powerful construct that
# fits.  These flag manual reimplementations of standard combinators —
# match-on-Option that could be Option::map, if-let-else that could be
# map_or, and so on.  See llms.org "Rule of least power" for the
# principle behind the set.
#
# Configured at "warn" rather than "deny" because some imperative forms
# are genuinely clearer (multi-line bodies, side effects, nested control
# flow); humans can override site-locally with #[allow(...)] and a
# one-line reason.  The defaults push agents toward the combinator form.
manual_map = "warn"
manual_filter = "warn"
manual_filter_map = "warn"
manual_find = "warn"
manual_find_map = "warn"
manual_flatten = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_unwrap_or = "warn"
manual_unwrap_or_default = "warn"
option_if_let_else = "warn"
map_unwrap_or = "warn"
needless_collect = "warn"
unnecessary_fold = "warn"
question_mark = "warn"
single_match_else = "warn"
collapsible_match = "warn"
redundant_pattern_matching = "warn"
